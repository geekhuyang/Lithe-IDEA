      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

        background: #1e1e1e;
        color: #9ca3af;

      height: 36px;
      border-radius: 50%;

      animation: cb-boot-spin 0.8s linear infinite;

      animation: cb-boot-pulse 1.6s ease-in-out infinite;
    }

      to {
        transform: rotate(360deg);
      }
    }

      0%, 100% {
        opacity: 0.45;
      }
      50% {
        opacity: 0.9;
      }
    }

      }
